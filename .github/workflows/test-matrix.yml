name: Tests

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.os == 'ubuntu-latest' && 'Linux' || matrix.os == 'macos-latest' && 'macOS' || 'Windows' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install UV
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "latest"

      - name: Cache UV dependencies (Unix)
        if: runner.os != 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-py${{ matrix.python-version }}-

      - name: Cache UV dependencies (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\uv\cache
          key: ${{ runner.os }}-uv-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-py${{ matrix.python-version }}-

      - name: Install dependencies
        run: make install-dev

      - name: Run tests
        run: make test

      - name: Upload coverage
        if: matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  sign:
    name: Sign (${{ startsWith(matrix.os, 'macos-') && 'macOS' || startsWith(matrix.os, 'windows-') && 'Windows' || 'Linux' }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install UV
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "latest"

      - name: Install dependencies
        run: make install

      - name: Fetch Sigstore conformance OIDC token
        run: |
          SIGSTORE_ID_TOKEN=$(curl -sSfL https://storage.googleapis.com/sigstore-conformance-testing-token/untrusted-testing-token.txt)
          echo "SIGSTORE_ID_TOKEN=$SIGSTORE_ID_TOKEN" >> "$GITHUB_ENV"

      - name: Generate EC key pair
        run: |
          openssl ecparam -genkey -name prime256v1 -noout -out private.pem
          openssl ec -in private.pem -pubout -out public.pem

      - name: Generate code-signing certificate
        env:
          MSYS_NO_PATHCONV: 1
        run: |
          openssl req -x509 -new -key private.pem -out cert.pem -days 365 \
            -subj "/CN=CI Test Signer" \
            -addext "keyUsage=digitalSignature" \
            -addext "extendedKeyUsage=codeSigning"

      - name: Sign with Sigstore (staging)
        continue-on-error: true
        id: sign-sigstore
        run: |
          uv run sigstore-a2a sign sigstore \
            examples/agent-cards/georoute-agent.json \
            --staging \
            --identity_token "${SIGSTORE_ID_TOKEN}" \
            -o signed-sigstore.json

      - name: Sign with EC key
        run: |
          uv run sigstore-a2a sign key \
            examples/agent-cards/georoute-agent.json \
            --private-key private.pem \
            -o signed-key.json

      - name: Sign with certificate
        run: |
          uv run sigstore-a2a sign certificate \
            examples/agent-cards/georoute-agent.json \
            --private-key private.pem \
            --signing-cert cert.pem \
            --cert-chain cert.pem \
            -o signed-cert.json

      - name: Sign with EC key + provenance
        run: |
          uv run sigstore-a2a sign key \
            examples/agent-cards/georoute-agent.json \
            --private-key private.pem \
            --provenance \
            -o signed-key-prov.json

      - name: Verify Sigstore locally
        if: steps.sign-sigstore.outcome == 'success'
        continue-on-error: true
        run: |
          uv run sigstore-a2a verify sigstore signed-sigstore.json \
            --staging \
            --identity "untrusted-sa@sigstore-conformance.iam.gserviceaccount.com" \
            --identity_provider "https://accounts.google.com"

      - name: Verify key and certificate locally
        run: |
          uv run sigstore-a2a verify key signed-key.json --public-key public.pem
          uv run sigstore-a2a verify certificate signed-cert.json --cert-chain cert.pem

      - name: Upload signed artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-${{ matrix.os }}
          path: |
            signed-key.json
            signed-cert.json
            signed-key-prov.json
            public.pem
            cert.pem
          if-no-files-found: error
          retention-days: 1

      - name: Upload Sigstore signed artifact
        if: steps.sign-sigstore.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-sigstore-${{ matrix.os }}
          path: signed-sigstore.json
          retention-days: 1

  cross-os-verify:
    name: Verify on ${{ startsWith(matrix.os, 'macos-') && 'macOS' || startsWith(matrix.os, 'windows-') && 'Windows' || 'Linux' }} (signed on ${{ startsWith(matrix.signed-on, 'macos-') && 'macOS' || startsWith(matrix.signed-on, 'windows-') && 'Windows' || 'Linux' }})
    if: always()
    needs: [sign]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        signed-on: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install UV
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "latest"

      - name: Install dependencies
        run: make install

      - name: Download signed artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-${{ matrix.signed-on }}

      - name: Download Sigstore signed artifact
        continue-on-error: true
        id: download-sigstore
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-sigstore-${{ matrix.signed-on }}

      - name: Verify Sigstore signature
        if: steps.download-sigstore.outcome == 'success'
        continue-on-error: true
        run: |
          uv run sigstore-a2a verify sigstore signed-sigstore.json \
            --staging \
            --identity "untrusted-sa@sigstore-conformance.iam.gserviceaccount.com" \
            --identity_provider "https://accounts.google.com"

      - name: Verify EC key signature
        run: uv run sigstore-a2a verify key signed-key.json --public-key public.pem

      - name: Verify certificate signature
        run: uv run sigstore-a2a verify certificate signed-cert.json --cert-chain cert.pem

      - name: Verify EC key + provenance signature
        run: uv run sigstore-a2a verify key signed-key-prov.json --public-key public.pem

  build:
    name: Build (${{ matrix.os == 'ubuntu-latest' && 'Linux' || matrix.os == 'macos-latest' && 'macOS' || 'Windows' }})
    runs-on: ${{ matrix.os }}
    needs: [test, sign]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install UV
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "latest"

      - name: Cache UV dependencies (Unix)
        if: runner.os != 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Cache UV dependencies (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\uv\cache
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Build package
        run: make build

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.os }}
          path: dist/
          retention-days: 7

  all-tests-pass:
    name: All Tests Pass
    runs-on: ubuntu-latest
    needs: [test, sign, cross-os-verify, build]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.sign.result }}" != "success" ]] || \
             [[ "${{ needs.cross-os-verify.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "Some jobs failed"
            exit 1
          fi
          echo "All jobs passed!"
