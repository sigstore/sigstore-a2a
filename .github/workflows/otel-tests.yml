name: OTel Tracing Tests
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths-ignore:
      - '**/*.md'
      - '*.md'
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  otel-tracing-tests:
    name: OTel tracing integration tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      jaeger:
        image: jaegertracing/all-in-one:latest
        ports:
          - 16686:16686
          - 4318:4318

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install UV
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "latest"

      - name: Install with OTel extras
        run: uv pip install --system -e ".[otel]"

      - name: Wait for Jaeger readiness
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:16686/api/services > /dev/null 2>&1; then
              echo "Jaeger is ready"
              exit 0
            fi
            echo "Waiting for Jaeger... attempt $i/30"
            sleep 2
          done
          echo "Jaeger did not become ready in time"
          exit 1

      - name: Run OTel tracing tests
        run: ./scripts/tests/test-otel.sh
